<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1.6th Anniversary, Dita Sukma Ayu 💙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
  }

  body {
    background: linear-gradient(180deg, #d6ecff 0%, #bfe3ff 40%, #a9d8ff 100%);
    position: relative;
  }

  /* ====== PEMANDANGAN ====== */
  #scene {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  #scene svg { width: 100%; height: 100%; display: block; }

  /* ====== HUJAN LOVE ====== */
  #hearts {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }
  .heart {
    position: absolute;
    top: -10vh;
    font-size: 22px;
    animation: fall linear infinite;
    opacity: 0.85;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12));
    will-change: transform;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  /* ====== KARTU TEKS ====== */
  #cardWrap {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
  }
  #card {
    pointer-events: auto;
    max-width: 720px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;
    padding: 34px 30px;
    box-shadow: 0 20px 50px rgba(40, 100, 170, 0.25);
    transition: opacity 1s ease, transform 1s ease;
    scrollbar-width: thin;
  }
  #card::-webkit-scrollbar { width: 6px; }
  #card::-webkit-scrollbar-thumb { background: #8ec5f0; border-radius: 10px; }

  #card.hidden {
    opacity: 0;
    transform: scale(0.96) translateY(12px);
  }

  .judul {
    font-size: clamp(1.15rem, 3.2vw, 1.6rem);
    color: #1c5d99;
    text-align: center;
    margin-bottom: 18px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: 0.3px;
  }

  .isi {
    font-size: clamp(0.95rem, 2.4vw, 1.1rem);
    color: #2b4a66;
    text-align: justify;
    line-height: 1.8;
    white-space: pre-line;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #1c5d99;
    margin-left: 2px;
    vertical-align: -0.15em;
    animation: blink 0.9s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ====== KONTROL MUSIK ====== */
  #musicBtn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 30;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.9);
    color: #1c5d99;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(40,100,170,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, background 0.2s;
  }
  #musicBtn:hover { transform: scale(1.08); background: #fff; }
  #musicBtn.playing { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 6px 18px rgba(40,100,170,0.3); }
    50% { box-shadow: 0 6px 26px rgba(224,80,122,0.5); }
  }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 30;
    font-size: 0.75rem;
    color: #3d6a92;
    background: rgba(255,255,255,0.75);
    padding: 8px 14px;
    border-radius: 20px;
    opacity: 0;
    animation: hintFade 6s ease forwards;
  }
  @keyframes hintFade {
    0% { opacity: 0; }
    15% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  @media (max-width: 600px) {
    #card { padding: 24px 20px; border-radius: 18px; }
    #musicBtn { width: 46px; height: 46px; font-size: 19px; }

<script>
/* =========================================================
   1. HUJAN LOVE
   ========================================================= */
(function createHearts() {
  const container = document.getElementById('hearts');
  const symbols = ['💙','💖','💕','💗','💞','🌸'];
  const count = window.innerWidth < 600 ? 22 : 40;

  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.animationDuration = (7 + Math.random() * 9) + 's';
    h.style.animationDelay = (-Math.random() * 14) + 's';
    h.style.opacity = 0.5 + Math.random() * 0.5;
    container.appendChild(h);
  }
})();

/* =========================================================
   2. TRANSISI TEKS (hilang -> timbul -> hilang -> ganti)
   ========================================================= */
(function textSequence() {
  const judulEl = document.getElementById('judul');
  const isiEl   = document.getElementById('isi');
  const card    = document.getElementById('card');

  const slides = [
    {
      judul: '💙 Happy 1.6th Anniversary, Dita Sukma Ayu! 💙',
      isi: 'Terima kasih yaa sudah menjadi alasan tersenyum dan bahagia untukku selama satu setengah tahun lebih ini.'
    },
    {
      judul: '🌿 Adek Sayang… 🌿',
      isi: 'Aku tahu Tugas Akhir dan PKL jurusan Kesehatan Gigi ini menguras banyak energi dan pikiranmu.\n\nTapi aku percaya banget sama kamu, kamu wanita yang kuat dan penuh bakat.'
    },
    {
      judul: '✨ Semangat, Calon Lulusan Terbaikku ✨',
      isi: 'Sedikit lagi puncak perjuangan kuliahmu di Poltekkes Semarang akan selesai.\n\nSemangat terus yaa calon calon lulusan terbaikku!'
    },
    {
      judul: '💖 Ada Aku untukmu 💖',
      isi: 'Kalau capek, istirahat sejenak yaa, ada aku yang selalu siap menemani dan mendoakanmu.\n\nDari aku, yang selalu menyayangimu.'
    }
  ];

  let index = 0;

  function typeText(el, text, speed, done) {
    el.innerHTML = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    let i = 0;
    const timer = setInterval(() => {
      if (i < text.length) {
        cursor.insertAdjacentText('beforebegin', text.charAt(i));
        i++;
      } else {
        clearInterval(timer);
        setTimeout(() => { cursor.remove(); done && done(); }, 700);
      }
    }, speed);
  }

  function showSlide() {
    const slide = slides[index];

    card.classList.add('hidden');

    setTimeout(() => {
      judulEl.textContent = slide.judul;
      isiEl.innerHTML = '';
      card.classList.remove('hidden');

      setTimeout(() => {
        typeText(isiEl, slide.isi, 28, () => {
          setTimeout(() => {
            index = (index + 1) % slides.length;
            showSlide();
          }, 3400);
        });
      }, 500);
    }, 1000);
  }

  showSlide();
})();

/* =========================================================
   3. MUSIK LATAR (Web Audio API — melodi lembut romantis)
   ========================================================= */
(function musicPlayer() {
  const btn = document.getElementById('musicBtn');
  let audioCtx = null;
  let playing = false;
  let masterGain = null;
  let loopTimer = null;

  const chords = [
    { bass: 130.81, notes: [261.63, 329.63, 392.00, 523.25] }, // C
    { bass: 98.00,  notes: [246.94, 392.00, 493.88, 587.33] }, // G
    { bass: 110.00, notes: [220.00, 261.63, 329.63, 440.00] }, // Am
    { bass: 87.31,  notes: [174.61, 220.00, 261.63, 349.23] }  // F
  ];

  const melody = [
    523.25, 587.33, 659.25, 523.25,
    493.88, 587.33, 659.25, 783.99,
    440.00, 523.25, 659.25, 587.33,
    349.23, 440.00, 523.25, 440.00
  ];

  function playNote(freq, startTime, duration, volume, type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(volume, startTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function scheduleBar(startTime) {
    chords.forEach((chord, ci) => {
      const t = startTime + ci * 2.4;
      playNote(chord.bass, t, 2.4, 0.12, 'sine');
      chord.notes.forEach((f, ni) => {
        playNote(f, t, 2.4, 0.035, 'triangle');
        playNote(f, t + ni * 0.15, 2.0, 0.025, 'sine');
      });
    });

    melody.forEach((freq, mi) => {
      const t = startTime + mi * 0.6;
      playNote(freq, t, 1.4, 0.06, 'sine');
    });
  }

  function loopMusic() {
    if (!playing || !audioCtx) return;
    const now = audioCtx.currentTime + 0.1;
    scheduleBar(now);
    loopTimer = setTimeout(loopMusic, 9600);
  }

  function startMusic() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.8;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playing = true;
    btn.classList.add('playing');
    btn.textContent = '⏸️';
    loopMusic();
  }

  function stopMusic() {
    playing = false;
    btn.classList.remove('playing');
    btn.textContent = '🎵';
    if (loopTimer) clearTimeout(loopTimer);
    if (audioCtx) {
      const now = audioCtx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.4);
      setTimeout(() => {
        if (!playing) {
          audioCtx.suspend();
          masterGain.gain.value = 0.8;
        }
      }, 500);
    }
  }

  btn.addEventListener('click', () => {
    if (playing) stopMusic();
    else startMusic();
  });

  const startOnInteraction = () => {
    if (!playing) startMusic();
    window.removeEventListener('pointerdown', startOnInteraction);
    window.removeEventListener('keydown', startOnInteraction);
  };
  window.addEventListener('pointerdown', startOnInteraction, { once: true });
  window.addEventListener('keydown', startOnInteraction, { once: true });

  const hintEl = document.getElementById('hint');
  const hideHint = () => {
    hintEl.style.transition = 'opacity 0.6s';
    hintEl.style.opacity = '0';
    setTimeout(() => hintEl.remove(), 700);
  };
  btn.addEventListener('click', hideHint);
})();
</script>
</body>
</html>
